name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Proposed release tag for signed build verification (no publication)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  YTLR_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }} bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin-aarch64
          - name: Windows
            os: windows-latest
            platform: windows-x86_64
          - name: Linux
            os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release version
        shell: bash
        run: |
          tag_version="${YTLR_RELEASE_TAG#v}"
          project_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$project_version"
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64
      - run: pnpm install --frozen-lockfile
      - name: Build release bundle
        run: pnpm build:release
        env:
          YTLR_UPDATER_PUBLIC_KEY: ${{ vars.YTLR_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Generate signed update metadata
        run: node packaging/updater.mjs manifest
        env:
          YTLR_UPDATER_PUBLIC_KEY: ${{ vars.YTLR_UPDATER_PUBLIC_KEY }}
          YTLR_EXPECTED_UPDATE_PLATFORM: ${{ matrix.platform }}
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.app.tar.gz
            target/release/bundle/**/*.sig
            target/release/update-manifests/*.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Assemble complete update manifest
        run: node packaging/updater.mjs merge release-assets latest.json
        env:
          YTLR_UPDATER_PUBLIC_KEY: ${{ vars.YTLR_UPDATER_PUBLIC_KEY }}
      - name: Determine release channel
        id: channel
        shell: bash
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "prerelease=" + process.env.YTLR_RELEASE_TAG.split("+")[0].includes("-") + "\n")'
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/**/*.app.tar.gz
            release-assets/**/*.sig
            latest.json
      - name: Publish after all signed assets are uploaded
        if: github.event_name == 'push'
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
